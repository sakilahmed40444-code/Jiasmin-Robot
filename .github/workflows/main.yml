# GitHub Actions — ফোন দিয়েই APK বানাও, PC লাগবে না।
# ব্যবহার: repo-তে lia-native-v1.0.zip upload করো + এই ফাইলটা
# .github/workflows/build.yml নামে "Create new file" দিয়ে paste করো।
# তারপর Actions tab → build শেষ হলে Artifacts থেকে lia-apk.zip download করো।

name: Build LIA APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o lia-native-*.zip -d build-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          cd build-src
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lia-apk
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
