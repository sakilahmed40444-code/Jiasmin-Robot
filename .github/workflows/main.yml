name: Build Myraa APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Myraa ZIP
        shell: bash
        run: |
          echo "ZIP files:"
          find . -maxdepth 2 -type f -name "*.zip" -print

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"

          mkdir -p myraa-project
          unzip -o "$ZIP_FILE" -d myraa-project

          echo "Extracted files:"
          find myraa-project -maxdepth 4 -type f | head -200

      - name: Find package.json
        id: project
        shell: bash
        run: |
          PKG=$(find myraa-project -type f -name "package.json" | head -n 1)

          if [ -z "$PKG" ]; then
            echo "ERROR: package.json not found inside ZIP"
            find myraa-project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PKG")

          echo "package.json found:"
          echo "$PKG"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install

      - name: Build Web App
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run build

      - name: Install Capacitor Android
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor Android
        working-directory: ${{ steps.project.outputs.dir }}
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradle executable
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myraa-APK
          path: |
            **/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
