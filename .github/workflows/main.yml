name: Build debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project dir
        run: |
          FOUND=$(find . -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -1)
          if [ -z "$FOUND" ]; then echo "package.json not found"; exit 1; fi
          DIR=$(dirname "$FOUND")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Project dir: $DIR"
          ls "$DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install + build web
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm ci || npm install
          npm run build

      - name: Capacitor sync android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x "${{ env.PROJECT_DIR }}/android/gradlew"

      - name: Remove stale Gradle JVM pin
        run: |
          # A committed org.gradle.java.home (e.g. JDK 17 from a PC) silently overrides JAVA_HOME.
          # Capacitor 7.4.4 needs JDK 21 (sourceCompatibility = VERSION_21).
          PROP="${{ env.PROJECT_DIR }}/android/gradle.properties"
          if [ -f "$PROP" ]; then
            sed -i '/^org.gradle.java.home=/d' "$PROP"
            echo "stale org.gradle.java.home pin removed (if any)"
          fi
          "${{ env.PROJECT_DIR }}/android/gradlew" --stop || true

      - name: Pin Gradle to JDK 21
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> "${{ env.PROJECT_DIR }}/android/gradle.properties"
          grep "org.gradle.java.home" "${{ env.PROJECT_DIR }}/android/gradle.properties"

      - name: gradlew version (diagnostic)
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew -version

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: myraa-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
