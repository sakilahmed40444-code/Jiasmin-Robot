name: Build Myraa APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Capacitor 7.4.x needs JDK 21 (sourceCompatibility 21 in @capacitor/android)
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/javac" -version

      - name: Extract project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "Myraa-APK-*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Myraa-APK-*.zip not found in repo"
            exit 1
          fi
          echo "Extracting $ZIP_FILE ..."
          rm -rf myraa-project
          mkdir -p myraa-project
          unzip -o "$ZIP_FILE" -d myraa-project
          test -f myraa-project/package.json || { echo "ERROR: package.json not inside ZIP"; exit 1; }
          echo "PROJECT_DIR=myraa-project" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Add Android platform (if missing)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Pin Gradle to Java 21
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          # A stale org.gradle.java.home (e.g. JDK 17 from a PC) silently
          # overrides JAVA_HOME and causes "invalid source release: 21".
          # Delete any existing pin, then pin to this runner's JDK 21.
          PROP="android/gradle.properties"
          sed -i '/^org.gradle.java.home=/d' "$PROP"
          echo "org.gradle.java.home=$JAVA_HOME" >> "$PROP"
          chmod +x android/gradlew
          cd android
          ./gradlew --stop || true
          ./gradlew -version

      - name: Add microphone permission
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash scripts/patch-android-permission.sh

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myraa-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
