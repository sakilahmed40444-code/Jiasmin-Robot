name: Build Myraa APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Capacitor 7.4.x compiles with sourceCompatibility = Java 21
      # (verified in @capacitor/android's capacitor/build.gradle),
      # so JDK 21 is REQUIRED to build.
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/javac" -version

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Pin Gradle to Java 21
        shell: bash
        run: |
          # A committed android/gradle.properties can carry a stale
          # org.gradle.java.home from a PC (e.g. JDK 17). That line silently
          # overrides JAVA_HOME, so Gradle compiles with the OLD JDK and
          # fails with "invalid source release: 21". Delete any existing
          # pin first, then pin to this runner's JDK 21.
          PROP="android/gradle.properties"
          sed -i '/^org.gradle.java.home=/d' "$PROP"
          echo "org.gradle.java.home=$JAVA_HOME" >> "$PROP"
          echo "--- gradle.properties (tail) ---"
          tail -n 6 "$PROP"
          chmod +x android/gradlew
          cd android
          ./gradlew --stop || true
          ./gradlew -version

      - name: Add microphone permission
        run: bash scripts/patch-android-permission.sh

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Myraa-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
